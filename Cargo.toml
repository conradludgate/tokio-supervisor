[package]
name = "tokio-supervisor"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.40", features = ["rt", "rt-multi-thread"] }

[dev-dependencies]
axum = "0.7.5"
tokio = { version = "1.40", features = ["full", "macros", "test-util"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
rustix = { version = "1.1.6", features = ["process"] }

[target.'cfg(all(target_os = "linux", target_arch = "x86_64"))'.dev-dependencies]
framehop = { version = "0.13.2", default-features = false, features = ["std"] }
nix = { version = "0.31.3", features = ["ptrace", "process", "signal"] }
object = { version = "0.36.4", default-features = false, features = ["read", "elf", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
debug = true
